[project]
name = "outlook-desktop-mcp"
version = "0.4.0"
description = "Outlook Desktop as an MCP server with native macOS Touch ID biometric gating — Windows (COM) and macOS (AppleScript). No Graph API, no Entra app registration — just your local Outlook."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Andreas Martin Aanerud", email = "aaanerud@microsoft.com" },
    { name = "Jacob Grobler", email = "jacob@grobler.nl" },
]
keywords = ["mcp", "outlook", "email", "com", "applescript", "automation", "windows", "macos", "microsoft", "claude", "touch-id", "biometrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Security",
]
dependencies = [
    "pywin32>=310; sys_platform == 'win32'",
    "mcp[cli]>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/hemelbesem90s/outlook-desktop-mcp"
Repository = "https://github.com/hemelbesem90s/outlook-desktop-mcp"
Upstream = "https://github.com/aaanerud/outlook-desktop-mcp"
Issues = "https://github.com/hemelbesem90s/outlook-desktop-mcp/issues"

[project.scripts]
outlook-desktop-mcp = "outlook_desktop_mcp.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_desktop_mcp"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = ["tests"]
